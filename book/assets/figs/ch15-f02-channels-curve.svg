<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img">
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7.5,3 L0,6 z" fill="#1a1a1a"/>
  </marker>
  <marker id="ah-s" markerWidth="8" markerHeight="8" refX="6.6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L6.6,3 L0,6 z" fill="#4a4a46"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
<text x="380.0" y="27.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">通道数（channels）：NCCL 的并行度旋钮，存在最优区间而不是越多越好</text>
<line x1="110.0" y1="250.0" x2="670.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="110.0" y1="250.0" x2="110.0" y2="74.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="390.0" y="266.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.4" font-weight="normal" fill="#1a1a1a" text-anchor="middle" opacity="1.0">通道数（NCCL_MAX_NCHANNELS）→</text>
<text x="96.0" y="162.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.4" font-weight="normal" fill="#1a1a1a" text-anchor="middle" opacity="1.0">有效带宽</text>
<path d="M 130 224 C 230 130, 310 94, 390 90 C 470 86, 540 120, 650 198" fill="none" stroke="#1f4e79" stroke-width="2.4"/>
<rect x="330.0" y="70.0" width="150.0" height="30.0" rx="6" fill="#fff3cf" stroke="#8a6a00" stroke-width="1.3" opacity="1.0"/>
<text x="405.0" y="90.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.4" font-weight="700" fill="#8a6a00" text-anchor="middle" opacity="1.0">最优区间</text>
<line x1="405.0" y1="100.0" x2="405.0" y2="88.0" stroke="#8a6a00" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="180.0" y="190.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.2" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">太少：
发射与传输
无法 overlap</text>
<text x="580.0" y="154.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.2" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">太多：
每条消息变小
启动与同步开销上升</text>
<rect x="40.0" y="272.0" width="680.0" height="40.0" rx="6" fill="#fbfbf8" stroke="#cfcfc9" stroke-width="1.2" opacity="1.0"/>
<text x="380.0" y="297.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.2" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">典型现象：通道太少 → 带宽上不去；通道太多 → 带宽反而下降。最优值通常由 NCCL 自动选取。</text>
</svg>