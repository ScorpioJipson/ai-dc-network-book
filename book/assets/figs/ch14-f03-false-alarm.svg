<text x="402.0" y="248.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0">⇒ 1 条 P1（含受影响范围）</text>
<text x="402.0" y="263.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.4" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0">⇒ + N 条 P3（明细）</text>
