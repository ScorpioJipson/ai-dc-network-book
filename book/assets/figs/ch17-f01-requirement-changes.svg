<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img">
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7.5,3 L0,6 z" fill="#1a1a1a"/>
  </marker>
  <marker id="ah-s" markerWidth="8" markerHeight="8" refX="6.6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L6.6,3 L0,6 z" fill="#4a4a46"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
<text x="380.0" y="27.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">需求口径半年变了三次：每一次都触发一轮全量重算</text>
<rect x="34.0" y="50.0" width="208.0" height="76.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.5" opacity="1.0"/>
<text x="138.0" y="74.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="11.5" font-weight="700" fill="#1f4e79" text-anchor="middle" opacity="1.0">第 1 次</text>
<text x="138.0" y="96.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.6" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">一期口径</text>
<text x="138.0" y="114.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.2" font-weight="normal" fill="#1a1a1a" text-anchor="middle" opacity="1.0">先按 32 台组网</text>
<line x1="244.0" y1="88.0" x2="268.0" y2="88.0" stroke="#4a4a46" stroke-width="1.5"/>
<line x1="244.0" y1="88.0" x2="268.0" y2="88.0" stroke="#4a4a46" stroke-width="1.5" marker-end="url(#ah-s)"/>
<rect x="270.0" y="50.0" width="208.0" height="76.0" rx="8" fill="#dceee2" stroke="#2e6b45" stroke-width="1.5" opacity="1.0"/>
<text x="374.0" y="74.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="11.5" font-weight="700" fill="#2e6b45" text-anchor="middle" opacity="1.0">第 2 次</text>
<text x="374.0" y="96.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.6" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">二期口径</text>
<text x="374.0" y="114.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.2" font-weight="normal" fill="#1a1a1a" text-anchor="middle" opacity="1.0">64 台也快到了，按 32 + 64 台分期</text>
<line x1="480.0" y1="88.0" x2="504.0" y2="88.0" stroke="#4a4a46" stroke-width="1.5"/>
<line x1="480.0" y1="88.0" x2="504.0" y2="88.0" stroke="#4a4a46" stroke-width="1.5" marker-end="url(#ah-s)"/>
<rect x="506.0" y="50.0" width="208.0" height="76.0" rx="8" fill="#f7e6d2" stroke="#9a5b12" stroke-width="1.5" opacity="1.0"/>
<text x="610.0" y="74.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="11.5" font-weight="700" fill="#9a5b12" text-anchor="middle" opacity="1.0">第 3 次</text>
<text x="610.0" y="96.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.6" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">三期口径</text>
<text x="610.0" y="114.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.2" font-weight="normal" fill="#1a1a1a" text-anchor="middle" opacity="1.0">远期规划 128 台，整体设计要能扩到 128 台</text>
<rect x="34.0" y="142.0" width="692.0" height="74.0" rx="6" fill="#fbfbf8" stroke="#cfcfc9" stroke-width="1.3" opacity="1.0"/>
<text x="48.0" y="164.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0">每一次都要全量重算：</text>
<rect x="150.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="194.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">端口配比</text>
<rect x="244.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="288.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">交换机台数</text>
<rect x="338.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="382.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">模块数量</text>
<rect x="432.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="476.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">缆长分档</text>
<rect x="526.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="570.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">重发方案 docx</text>
<rect x="620.0" y="150.0" width="88.0" height="26.0" rx="6" fill="#f4f4f1" stroke="#4a4a46" stroke-width="1.4" opacity="1.0"/>
<text x="664.0" y="163.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="8.8" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">重发报价单</text>
<text x="48.0" y="204.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.6" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">联动文档：IP 规划与端口表（10 页签）、组网存储方案、报价单 —— 三份文档必须同步改，改漏一份就是新的口径错误。</text>
<rect x="34.0" y="228.0" width="692.0" height="76.0" rx="6" fill="#f7dcdc" stroke="#a02020" stroke-width="1.5" opacity="1.0"/>
<text x="48.0" y="250.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.6" font-weight="700" fill="#a02020" text-anchor="start" opacity="1.0">代价可量化：单次全量重算约 3 ~ 5 人日【估算】，三次合计 9 ~ 15 人日。</text>
<text x="48.0" y="274.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0">★ 真正的代价不是人日，而是“每一次重算都可能引入新的口径错误”——这是后面询价翻车的根因之一。</text>
<text x="48.0" y="294.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.2" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">正解不是“算得更快”，而是把需求冻结点（F1–F6）先定下来，冻结之后再变就要走变更。</text>
</svg>