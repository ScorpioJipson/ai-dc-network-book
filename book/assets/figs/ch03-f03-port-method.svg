<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img">
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L7.5,3 L0,6 z" fill="#1a1a1a"/>
  </marker>
  <marker id="ah-s" markerWidth="8" markerHeight="8" refX="6.6" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L6.6,3 L0,6 z" fill="#4a4a46"/>
  </marker>
</defs>
<rect x="0" y="0" width="760" height="620" fill="#ffffff"/>
<rect x="40.0" y="30.0" width="680.0" height="66.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="70.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#1f4e79" text-anchor="start" opacity="1.0">Step 1</text>
<text x="150.0" y="60.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">端点端口数  E = N × m</text>
<text x="150.0" y="80.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">128 × 8 = 1024 个端点</text>
<line x1="380.0" y1="96.0" x2="380.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="96.0" x2="380.0" y2="104.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40.0" y="104.0" width="680.0" height="66.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="144.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#1f4e79" text-anchor="start" opacity="1.0">Step 2</text>
<text x="150.0" y="134.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">每 Leaf 下联口  d = P ÷ 2</text>
<text x="150.0" y="154.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">128 ÷ 2 = 64 口/Leaf</text>
<line x1="380.0" y1="170.0" x2="380.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="170.0" x2="380.0" y2="178.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40.0" y="178.0" width="680.0" height="66.0" rx="8" fill="#fff3cf" stroke="#8a6a00" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="218.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#8a6a00" text-anchor="start" opacity="1.0">Step 3</text>
<text x="150.0" y="208.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">Leaf 台数（不含轨约束） L0 = ⌈E ÷ d⌉</text>
<text x="150.0" y="228.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">⌈1024 ÷ 64⌉ = 16 台</text>
<line x1="380.0" y1="244.0" x2="380.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="244.0" x2="380.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40.0" y="252.0" width="680.0" height="66.0" rx="8" fill="#f7dcdc" stroke="#a02020" stroke-width="1.6" opacity="1.0"/>
<text x="66.0" y="292.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#a02020" text-anchor="start" opacity="1.0">Step 3′</text>
<text x="150.0" y="282.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">★ 轨约束修正：⌈N ÷ d⌉ × 轨数 k</text>
<text x="150.0" y="302.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">⌈128÷64⌉×8 = 2×8 = 16 台</text>
<line x1="380.0" y1="318.0" x2="380.0" y2="326.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="318.0" x2="380.0" y2="326.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="700.0" y="264.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.5" font-weight="700" fill="#a02020" text-anchor="end" opacity="1.0">漏算点</text>
<rect x="40.0" y="326.0" width="680.0" height="66.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="366.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#1f4e79" text-anchor="start" opacity="1.0">Step 4</text>
<text x="150.0" y="356.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">上联口 = P − d，按终态一次性规划</text>
<text x="150.0" y="376.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">64 口/Leaf；每 Spine 4 条</text>
<line x1="380.0" y1="392.0" x2="380.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="392.0" x2="380.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40.0" y="400.0" width="680.0" height="66.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="440.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#1f4e79" text-anchor="start" opacity="1.0">Step 5</text>
<text x="150.0" y="430.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">Spine 台数 ≥ ⌈U ÷ (128×75%)⌉</text>
<text x="150.0" y="450.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">U=1024 → 16 台</text>
<line x1="380.0" y1="466.0" x2="380.0" y2="474.0" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="380.0" y1="466.0" x2="380.0" y2="474.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="40.0" y="474.0" width="680.0" height="66.0" rx="8" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.2" opacity="1.0"/>
<text x="66.0" y="514.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="700" fill="#1f4e79" text-anchor="start" opacity="1.0">Step 6</text>
<text x="150.0" y="504.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="start" opacity="1.0">备料：光缆 = E + U；模块见 §2.3</text>
<text x="150.0" y="524.0" font-family="Consolas, NSimSun, monospace" font-size="11.5" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">2048 条；4096 只</text>
</svg>