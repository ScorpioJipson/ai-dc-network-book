<rect x="30.0" y="58.0" width="300.0" height="48.0" rx="6" fill="#e8e0f2" stroke="#5a3f86" stroke-width="1.3" opacity="1.0"/>
<text x="180.0" y="80.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">Verbs API</text>
<text x="180.0" y="97.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">上层应用调用同一套 Verbs</text>
<rect x="30.0" y="112.0" width="300.0" height="48.0" rx="6" fill="#e8e0f2" stroke="#5a3f86" stroke-width="1.3" opacity="1.0"/>
<text x="180.0" y="134.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">IB Transport（可靠连接、信用流控）</text>
<text x="180.0" y="151.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">无损写在协议里</text>
<rect x="30.0" y="166.0" width="300.0" height="48.0" rx="6" fill="#e8e0f2" stroke="#5a3f86" stroke-width="1.3" opacity="1.0"/>
<text x="180.0" y="188.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">IB Network / IB Link</text>
<text x="180.0" y="205.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">16/32/64/128/256 字节包</text>
<rect x="30.0" y="220.0" width="300.0" height="48.0" rx="6" fill="#e8e0f2" stroke="#5a3f86" stroke-width="1.3" opacity="1.0"/>
<text x="180.0" y="242.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">IB PHY（私有物理层）</text>
<text x="180.0" y="259.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">厂商封闭实现</text>
<text x="580.0" y="40.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="13.5" font-weight="700" fill="#1f4e79" text-anchor="middle" opacity="1.0">RoCEv2（开放以太）</text>
<rect x="430.0" y="58.0" width="300.0" height="48.0" rx="6" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.3" opacity="1.0"/>
<text x="580.0" y="80.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">Verbs API</text>
<text x="580.0" y="97.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">同一套 Verbs，上层不改</text>
<rect x="430.0" y="112.0" width="300.0" height="48.0" rx="6" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.3" opacity="1.0"/>
<text x="580.0" y="134.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">IB Transport over UDP</text>
<text x="580.0" y="151.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">无损要靠配置实现</text>
<rect x="430.0" y="166.0" width="300.0" height="48.0" rx="6" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.3" opacity="1.0"/>
<text x="580.0" y="188.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">IP / Ethernet（ECMP、BGP）</text>
<text x="580.0" y="205.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">标准以太，可插拔</text>
<rect x="430.0" y="220.0" width="300.0" height="48.0" rx="6" fill="#dbe6f5" stroke="#1f4e79" stroke-width="1.3" opacity="1.0"/>
<text x="580.0" y="242.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">以太 PHY（400G QSFP112）</text>
<text x="580.0" y="259.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9.8" font-weight="normal" fill="#4a4a46" text-anchor="middle" opacity="1.0">通用光模块</text>
<text x="380.0" y="344.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="11.5" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">★ 关键差异：IB 的“无损”做在协议与芯片里；RoCEv2 的“无损”靠 PFC/ECN 配出来 —— 配错就崩。</text>
</svg>