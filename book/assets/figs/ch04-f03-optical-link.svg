<text x="620.0" y="289.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.5" font-weight="700" fill="#9a5b12" text-anchor="start" opacity="1.0">长期漂移</text>
<rect x="60.0" y="312.0" width="640.0" height="46.0" rx="6" fill="#fff3cf" stroke="#8a6a00" stroke-width="1.4" opacity="1.0"/>
