<text x="470.0" y="255.0" font-family="Consolas, NSimSun, monospace" font-size="10.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" opacity="1.0">可增加 1 ~ 4 dB</text>
<text x="620.0" y="255.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.5" font-weight="700" fill="#a02020" text-anchor="start" opacity="1.0">隐形杀手</text>
