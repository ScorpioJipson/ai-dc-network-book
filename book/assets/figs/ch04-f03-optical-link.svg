<text x="80.0" y="350.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.5" font-weight="600" fill="#a02020" text-anchor="start" opacity="1.0">问题链路：插损 6.1 dB → 收光 −7.1 dBm，裕量 0.4 dB  ⚠（温漂或老化即误码）</text>
<text x="380.0" y="382.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.8" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">合格口径：收光裕量 ≥ 3 dB —— 不是“在规格内就算合格”。</text>
