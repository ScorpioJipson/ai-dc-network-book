<text x="196.0" y="240.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="9" font-weight="normal" fill="#4a4a46" text-anchor="start" opacity="1.0">先落本地 NVMe，再后台搬移；后台窗口 3 ~ 5 分钟【设计】</text>
<text x="380.0" y="296.0" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="10.4" font-weight="600" fill="#1a1a1a" text-anchor="middle" opacity="1.0">★ 分级方案的价值不是“存储更快”，而是把同步问题改成了异步问题 —— 把 20 秒的瞬时风暴摊进后台窗口。</text>
